version: "3.9"

services:

  postgres:
    image: postgres:15
    container_name: cicd-postgres

    environment:
      POSTGRES_DB: cicd
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    ports:
      - "5434:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cicd"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    container_name: cicd-redis

    ports:
      - "6380:6379"

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile

    container_name: cicd-ai-service

    ports:
      - "8000:8000"

    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_MODEL=${OPENAI_MODEL:-llama-3.1-8b-instant}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-https://api.groq.com/openai/v1}
      - GITHUB_TOKEN=${GITHUB_TOKEN}
      - LOG_LEVEL=INFO

    depends_on:
      postgres:
        condition: service_healthy

    # Removed curl-based healthcheck
    # because python slim image does not include curl

  api-service:
    build:
      context: ./backend
      dockerfile: api-service/Dockerfile

    container_name: cicd-api-service

    ports:
      - "8081:8081"

    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/cicd
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=postgres

      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_DATA_REDIS_PORT=6379

      - GITHUB_TOKEN=${GITHUB_TOKEN}

      - AI_SERVICE_URL=http://ai-service:8000

    depends_on:
      postgres:
        condition: service_healthy

      redis:
        condition: service_healthy

      ai-service:
        condition: service_started

volumes:
  postgres_data: