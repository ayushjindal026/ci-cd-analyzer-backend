# ═════════════════════════════════════════════════════════════════════════════
# NETWORKS
# ═════════════════════════════════════════════════════════════════════════════
networks:
  pipelineiq:
    driver: bridge

# ═════════════════════════════════════════════════════════════════════════════
# VOLUMES
# ═════════════════════════════════════════════════════════════════════════════
volumes:
  postgres_data:
  gradle_cache:
  backend_logs:

# ═════════════════════════════════════════════════════════════════════════════
# SERVICES
# ═════════════════════════════════════════════════════════════════════════════
services:

  # ──────────────────────────────────────────────────────────────────────────
  # PostgreSQL Database
  # ──────────────────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: pipelineiq-db

    restart: unless-stopped

    environment:
      POSTGRES_DB: pipelineiq
      POSTGRES_USER: pipelineiq
      POSTGRES_PASSWORD: ${DB_PASSWORD}

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pipelineiq -d pipelineiq"]
      interval: 10s
      timeout: 5s
      retries: 5

    logging:
      options:
        max-size: "10m"
        max-file: "3"

    networks:
      - pipelineiq

  # ──────────────────────────────────────────────────────────────────────────
  # Spring Boot Backend API
  # ──────────────────────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: api-service/Dockerfile

    container_name: pipelineiq-api

    restart: unless-stopped

    depends_on:
      postgres:
        condition: service_healthy

    env_file:
      - .env

    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/pipelineiq
      SPRING_DATASOURCE_USERNAME: pipelineiq
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}

      SPRING_JPA_HIBERNATE_DDL_AUTO: update

      SERVER_PORT: 8081

      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}

      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET}

      JWT_SECRET: ${JWT_SECRET}

      OPENAI_API_KEY: ${OPENAI_API_KEY:-}

      # ── Future-ready ─────────────────────────────────────────────────────
      SPRING_PROFILES_ACTIVE: docker

    ports:
      - "8081:8081"

    volumes:
      - gradle_cache:/root/.gradle
      - backend_logs:/app/logs

    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 40s

    logging:
      options:
        max-size: "10m"
        max-file: "5"

    networks:
      - pipelineiq

  # ──────────────────────────────────────────────────────────────────────────
  # React Frontend + Nginx
  # ──────────────────────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile

    container_name: pipelineiq-ui

    restart: unless-stopped

    depends_on:
      backend:
        condition: service_healthy

    ports:
      - "80:80"
      - "3000:80"

    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 5

    logging:
      options:
        max-size: "10m"
        max-file: "3"

    networks:
      - pipelineiq