name: CI

on:
  push:
    branches: [ main ]

  pull_request:
    branches: [ main ]

jobs:

  build-and-test:

    runs-on: ubuntu-latest

    services:

      postgres:
        image: postgres:15

        env:
          POSTGRES_DB: cicd
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres

        ports:
          - 5432:5432

        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7

        ports:
          - 6379:6379

    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4

        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build and test backend

        working-directory: backend

        run: mvn clean verify

        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/cicd
          SPRING_DATASOURCE_USERNAME: postgres
          SPRING_DATASOURCE_PASSWORD: postgres

          SPRING_DATA_REDIS_HOST: localhost
          SPRING_DATA_REDIS_PORT: 6379

          JWT_SECRET: test-super-secret-key-for-ci-minimum-32-chars

          GITHUB_OAUTH_SECRET: dummy-secret
          GITHUB_TOKEN: dummy-token

      - name: Build Docker image

        run: |
          docker build \
            -f backend/api-service/Dockerfile \
            backend/ \
            -t cicd-analyzer:${{ github.sha }}