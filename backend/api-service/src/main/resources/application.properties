# ================================================================
# APPLICATION
# ================================================================
spring.application.name=cicd-analyzer
server.port=${SERVER_PORT:8081}

# ================================================================
# DATASOURCE
# ================================================================
# Docker-aware datasource configuration
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://postgres:5432/pipelineiq}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:pipelineiq}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:changeme_local}

spring.datasource.hikari.pool-name=CicdHikariPool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000

# Avoid PostgreSQL timezone issues
spring.datasource.hikari.connection-init-sql=SET TIME ZONE 'UTC'

# ================================================================
# JPA / HIBERNATE
# ================================================================
spring.jpa.hibernate.ddl-auto=none

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Fix timezone issue
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Avoid lazy loading issues
spring.jpa.open-in-view=false

# ================================================================
# FLYWAY
# ================================================================
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-version=0

# ================================================================
# REDIS
# ================================================================
# Optional for now
spring.data.redis.host=${SPRING_REDIS_HOST:redis}
spring.data.redis.port=${SPRING_REDIS_PORT:6379}

# Disable Redis health check until Redis container is added
management.health.redis.enabled=false

# ================================================================
# ACTUATOR
# ================================================================
management.endpoints.web.exposure.include=health,info,mappings
management.endpoint.health.show-details=always

# ================================================================
# LOGGING
# ================================================================
logging.level.com.ayush=DEBUG
logging.level.org.hibernate.SQL=DEBUG

# ================================================================
# GITHUB API
# ================================================================
github.token=${GITHUB_TOKEN:}
github.api-base-url=https://api.github.com
github.runs-per-page=50

# ================================================================
# SCHEDULER
# ================================================================
# Sync interval (default: 10 minutes)
sync.interval.ms=600000

# Delay before first sync after startup
sync.initial.delay.ms=60000

# ================================================================
# AI SERVICE
# ================================================================
# Future Docker AI service support
ai.service.url=${AI_SERVICE_URL:http://ai-service:8000}

# ================================================================
# GITHUB OAUTH
# ================================================================
github.oauth.client-id=${GITHUB_CLIENT_ID}
github.oauth.client-secret=${GITHUB_CLIENT_SECRET}

# ================================================================
# JWT
# ================================================================
# Must be at least 32 characters
jwt.secret=${JWT_SECRET:cicd-analyzer-super-secret-key-minimum-32-chars}
jwt.expiration-ms=604800000

# ================================================================
# CORS
# ================================================================
spring.web.cors.allowed-origins=${FRONTEND_URL:http://localhost:3000},http://localhost:5173
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.web.cors.allowed-headers=*
spring.web.cors.allow-credentials=true
spring.web.cors.max-age=3600

# ================================================================
# SWAGGER / OPENAPI
# ================================================================
springdoc.swagger-ui.path=/swagger-ui.html

# ================================================================
# DOCKER PROFILE
# ================================================================
spring.profiles.active=${SPRING_PROFILES_ACTIVE:docker}