# ================================================================
# APPLICATION
# ================================================================
spring.application.name=cicd-analyzer
server.port=8081

# ================================================================
# DATASOURCE
# ================================================================
spring.datasource.url=jdbc:postgresql://localhost:5433/cicd?options=-c%20TimeZone=UTC
spring.datasource.username=postgres
spring.datasource.password=postgres

spring.datasource.hikari.pool-name=CicdHikariPool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000

# ================================================================
# JPA / HIBERNATE
# ================================================================
spring.flyway.enabled=false
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Fix timezone issue
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Avoid lazy loading issues
spring.jpa.open-in-view=false

# ================================================================
# REDIS (optional for now)
# ================================================================
spring.data.redis.host=localhost
spring.data.redis.port=6379

# ================================================================
# ACTUATOR
# ================================================================
management.endpoints.web.exposure.include=health,info,mappings
management.endpoint.health.show-details=always

# ================================================================
# LOGGING
# ================================================================
logging.level.com.ayush=DEBUG
logging.level.org.hibernate.SQL=DEBUG

