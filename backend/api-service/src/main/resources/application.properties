# ============================================================
# PipelineIQ - Development Configuration
# ============================================================

spring.application.name=pipelineiq-analyzer
server.port=8081

# ============================================================
# Database
# ============================================================

spring.datasource.url=jdbc:postgresql://localhost:5432/pipelineiq
spring.datasource.username=pipelineiq
spring.datasource.password=changeme_local
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# ============================================================
# JPA / Hibernate
# ============================================================

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# ============================================================
# Flyway
# ============================================================

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# ============================================================
# Jackson
# ============================================================

spring.jackson.time-zone=UTC

# ============================================================
# JWT
# ============================================================

jwt.secret=${JWT_SECRET:local_dev_secret_min_32_chars_long_secure_key}
jwt.expiration-ms=${JWT_EXPIRATION:86400000}
jwt.access-token-expiration-ms=900000
jwt.refresh-token-expiration-ms=604800000
jwt.max-sessions-per-user=5
jwt.issuer=cicd-analyzer

# ============================================================
# GitHub OAuth + API
# ============================================================

github.oauth.client-id=${GITHUB_CLIENT_ID:}
github.oauth.client-secret=${GITHUB_CLIENT_SECRET:}
github.oauth.redirect-uri=https://rage-outfield-jokester.ngrok-free.dev/api/v1/auth/github/callback

github.token=${GITHUB_TOKEN:}

github.webhook.secret=${GITHUB_WEBHOOK_SECRET:}

github.api.base-url=https://api.github.com
github.api.timeout-ms=30000

# ============================================================
# AI
# ============================================================

ai.enabled=true
ai.provider=${AI_PROVIDER:groq}

ai.request-timeout-ms=60000
ai.max-retries=3

# ============================================================
# Groq
# ============================================================

ai.groq.api-key=${GROQ_API_KEY:}
ai.groq.model=${GROQ_MODEL:llama-3.1-8b-instant}

# ============================================================
# Redis
# ============================================================

spring.data.redis.host=${SPRING_DATA_REDIS_HOST:redis}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:6379}
spring.data.redis.timeout=2000

# ============================================================
# Async / Scheduling
# ============================================================

spring.task.execution.pool.core-size=4
spring.task.execution.pool.max-size=12
spring.task.execution.pool.queue-capacity=100

spring.task.scheduling.pool.size=4

# Sync scheduler
sync.enabled=true
sync.interval-ms=900000
sync.initial-delay-ms=60000
sync.log-retention-days=90

# ============================================================
# Retry
# ============================================================

spring.retry.enabled=true

# ============================================================
# Multipart Uploads
# ============================================================

spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

# ============================================================
# Notifications
# ============================================================

notifications.slack.enabled=true
notifications.email.enabled=false

# ============================================================
# Actuator
# ============================================================

management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized

# ============================================================
# Logging
# ============================================================

logging.level.com.ayush.cicd.api=DEBUG
logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=WARN

# Optional detailed logs
# logging.level.org.springframework.web=DEBUG
# logging.level.org.hibernate.type.descriptor.sql=TRACE

# ============================================================
# Compression
# ============================================================

server.compression.enabled=true
server.compression.mime-types=application/json,text/html,text/plain

# ============================================================
# Graceful Shutdown
# ============================================================

server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s

# ============================================================
# Frontend / CORS
# ============================================================

frontend.url=${FRONTEND_URL:http://localhost:3000}
websocket.allowed-origins=${FRONTEND_URL:http://localhost:3000}

# ============================================================
# GitHub Webhook Debugging
# ============================================================

logging.level.org.springframework.web.filter.CommonsRequestLoggingFilter=DEBUG


spring.security.oauth2.client.registration.github.client-id=${GITHUB_CLIENT_ID}
spring.security.oauth2.client.registration.github.client-secret=${GITHUB_CLIENT_SECRET}

spring.security.oauth2.client.registration.github.scope=read:user,user:email,repo

# Large STOMP payload support
spring.websocket.max-text-message-size=65536
spring.websocket.max-binary-message-size=65536