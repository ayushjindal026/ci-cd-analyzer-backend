# ================================================================
# APPLICATION
# ================================================================
spring.application.name=cicd-analyzer
server.port=8081

# ================================================================
# DATASOURCE
# ================================================================
spring.datasource.url=jdbc:postgresql://localhost:5433/cicd
spring.datasource.username=postgres
spring.datasource.password=postgres

spring.datasource.hikari.pool-name=CicdHikariPool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
# Override the server-level timezone (Asia/Calcutta is rejected by newer PostgreSQL versions)
spring.datasource.hikari.connection-init-sql=SET TIME ZONE 'UTC'

# ================================================================
# JPA / HIBERNATE
# ================================================================
spring.jpa.hibernate.ddl-auto=none
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-version=0
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Fix timezone issue
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Avoid lazy loading issues
spring.jpa.open-in-view=false

# ================================================================
# REDIS (optional for now)
# ================================================================
spring.data.redis.host=localhost
spring.data.redis.port=6379

# ================================================================
# ACTUATOR
# ================================================================
management.endpoints.web.exposure.include=health,info,mappings
management.endpoint.health.show-details=always

# ================================================================
# LOGGING
# ================================================================
logging.level.com.ayush=DEBUG
logging.level.org.hibernate.SQL=DEBUG

# ================================================================
# GITHUB API
# Replace with your actual token — never commit the real value
# ================================================================
github.token=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
github.api-base-url=https://api.github.com
github.runs-per-page=50

# ================================================================
# SCHEDULER
# ================================================================
# How long to wait between sync cycles (milliseconds). Default 10 min.
sync.interval.ms=600000
# How long to wait after startup before first sync. Default 60 sec.
sync.initial.delay.ms=60000

# ================================================================
# AI SERVICE
# ================================================================
ai.service.url=http://localhost:8000

